# GitHub Actions workflow for Playwright + pytest
# Runs on push, pull_request, schedule and on-demand (workflow_dispatch).
# Uses Xvfb so tests that open a real browser (headful) can run in CI.

name: CI - Playwright Tests

on:
  push:
    branches: 
      - Playwright/new-tests  
  pull_request:
    branches: 
      - Playwright/new-tests
  schedule:
    - cron: '0 2 * * *'    # daily at 02:00 UTC (adjust as needed)
  workflow_dispatch: {}    # manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers and deps
        run: |
          # installs browsers and necessary libs for CI
          npx playwright --version || true
          python -m playwright install --with-deps

      - name: Install Xvfb for headful browser support
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run tests (pytest)
        # Use Xvfb so headful browser launches in CI when tests use headful mode
        run: |
          mkdir -p reports
          xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' \
            pytest -q --junitxml=reports/junit.xml --html=reports/report.html --self-contained-html
        env:
          # ensure tests run headless by default if they read this flag;
          # you can remove or override in workflow_dispatch inputs
          PLAYWRIGHT_SLOW_MO: "200"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/